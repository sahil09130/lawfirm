<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="Illustration of the Supreme Court of India">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2740"/>
      <stop offset="0.7" stop-color="#3a3f4f"/>
      <stop offset="1" stop-color="#6b5a45"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2cfa8"/>
      <stop offset="1" stop-color="#b8996b"/>
    </linearGradient>
    <linearGradient id="col" x1="0" x2="1">
      <stop offset="0" stop-color="#9c8660"/>
      <stop offset="0.45" stop-color="#eee2c8"/>
      <stop offset="1" stop-color="#8d7a56"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a56a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8a56a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dusk sky -->
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="400" cy="300" r="260" fill="url(#glow)"/>

  <!-- Distant trees -->
  <g fill="#141b2b" opacity="0.8">
    <ellipse cx="90" cy="800" rx="70" ry="110"/>
    <ellipse cx="715" cy="790" rx="80" ry="120"/>
    <rect x="86" y="860" width="8" height="60"/>
    <rect x="708" y="860" width="8" height="60"/>
  </g>

  <!-- Central pediment and attic -->
  <path d="M120 470 L400 330 L680 470 Z" fill="#d6c2a0"/>
  <path d="M170 470 L400 360 L630 470 Z" fill="#a8906b" opacity="0.5"/>
  <rect x="120" y="462" width="560" height="22" fill="#efe4cf"/>
  <rect x="112" y="484" width="576" height="26" fill="url(#stone)"/>

  <!-- Chakra medallion in the pediment -->
  <g fill="none" stroke="#c8a56a" stroke-width="2.2">
    <circle cx="400" cy="468" r="30"/>
    <circle cx="400" cy="468" r="7" fill="#c8a56a"/>
  </g>
  <g stroke="#c8a56a" stroke-width="1" opacity="0.9">
    <line x1="407.0" y1="468.0" x2="430.0" y2="468.0"/>
    <line x1="406.8" y1="469.8" x2="429.0" y2="475.8"/>
    <line x1="406.1" y1="471.5" x2="426.0" y2="483.0"/>
    <line x1="404.9" y1="472.9" x2="421.2" y2="489.2"/>
    <line x1="403.5" y1="474.1" x2="415.0" y2="494.0"/>
    <line x1="401.8" y1="474.8" x2="407.8" y2="497.0"/>
    <line x1="400.0" y1="475.0" x2="400.0" y2="498.0"/>
    <line x1="398.2" y1="474.8" x2="392.2" y2="497.0"/>
    <line x1="396.5" y1="474.1" x2="385.0" y2="494.0"/>
    <line x1="395.1" y1="472.9" x2="378.8" y2="489.2"/>
    <line x1="393.9" y1="471.5" x2="374.0" y2="483.0"/>
    <line x1="393.2" y1="469.8" x2="371.0" y2="475.8"/>
    <line x1="393.0" y1="468.0" x2="370.0" y2="468.0"/>
    <line x1="393.2" y1="466.2" x2="371.0" y2="460.2"/>
    <line x1="393.9" y1="464.5" x2="374.0" y2="453.0"/>
    <line x1="395.1" y1="463.1" x2="378.8" y2="446.8"/>
    <line x1="396.5" y1="461.9" x2="385.0" y2="442.0"/>
    <line x1="398.2" y1="461.2" x2="392.2" y2="439.0"/>
    <line x1="400.0" y1="461.0" x2="400.0" y2="438.0"/>
    <line x1="401.8" y1="461.2" x2="407.8" y2="439.0"/>
    <line x1="403.5" y1="461.9" x2="415.0" y2="442.0"/>
    <line x1="404.9" y1="463.1" x2="421.2" y2="446.8"/>
    <line x1="406.1" y1="464.5" x2="426.0" y2="453.0"/>
    <line x1="406.8" y1="466.2" x2="429.0" y2="460.2"/>
  </g>

  <!-- Colonnade -->
  <rect x="150" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="144" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="144" y="820" width="42" height="12" fill="#b59e7c"/>
  <rect x="218" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="212" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="212" y="820" width="42" height="12" fill="#b59e7c"/>
  <rect x="286" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="280" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="280" y="820" width="42" height="12" fill="#b59e7c"/>
  <rect x="354" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="348" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="348" y="820" width="42" height="12" fill="#b59e7c"/>
  <rect x="446" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="440" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="440" y="820" width="42" height="12" fill="#b59e7c"/>
  <rect x="514" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="508" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="508" y="820" width="42" height="12" fill="#b59e7c"/>
  <rect x="582" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="576" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="576" y="820" width="42" height="12" fill="#b59e7c"/>
  <rect x="650" y="520" width="30" height="300" fill="url(#col)"/>
  <rect x="644" y="506" width="42" height="14" fill="#efe4cf"/>
  <rect x="644" y="820" width="42" height="12" fill="#b59e7c"/>

  <!-- Recessed central block and three arched openings -->
  <rect x="200" y="560" width="400" height="260" fill="#6f6048" opacity="0.55"/>
  <path d="M292 820 V660 a54 54 0 0 1 108 0 V820 Z" fill="#1d2433"/>
  <path d="M400 820 V660 a54 54 0 0 1 108 0 V820 Z" fill="#1d2433"/>

  <!-- Plinth and steps -->
  <rect x="90" y="832" width="620" height="22" fill="#d6c2a0"/>
  <rect x="60" y="854" width="680" height="24" fill="#bda77f"/>
  <rect x="30" y="878" width="740" height="24" fill="#a08a64"/>
  <rect x="0" y="902" width="800" height="98" fill="#1a2030"/>

  <!-- Flagpoles -->
  <rect x="96" y="330" width="3" height="140" fill="#c8a56a" opacity="0.8"/>
  <rect x="700" y="330" width="3" height="140" fill="#c8a56a" opacity="0.8"/>

  <!-- Caption -->
  <text x="400" y="975" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="5" fill="#c8a56a" opacity="0.7">SUPREME COURT OF INDIA</text>
</svg>
